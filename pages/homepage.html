<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homepage - Automato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="../css/homepage.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>

<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="../pages/transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-dark">Log In</button>
            </div>

            <div class="dropdown text-end">
                <a href="#" class="d-block text-decoration-none dropdown-toggle user-avatar" data-bs-toggle="dropdown">
                    <img src="../images/anonym_profile.png" width="40" height="40" class="rounded-circle">
                </a>

                <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                    <li>
                        <a class="dropdown-item" href="#" onclick="event.preventDefault(); ProjectManager.promptNewProject();">
                            <i class="bi bi-plus-circle me-2"></i>New project...
                        </a>
                    </li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<section class="hero-section">
    <div class="container py-5">
        <div class="row align-items-center">

            <div class="col-lg-6">
                <h1 class="display-4 fw-bold mb-3">Automato:</h1>
                <p class="lead text-muted mb-4">
                    An intuitive web app for creating and testing final state automata.
                </p>
            </div>

            <div class="col-lg-6">
                <div class="hero-image-placeholder">
                    <img src="../images/example_acceptor.png" width="400" height="400" alt="Automato Example">
                </div>
            </div>

        </div>
    </div>
</section>

<section class="features-section py-5 bg-light">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Your Projects</h2>

            <button type="button" class="btn btn-outline-red" onclick="ProjectManager.promptNewProject()">
                <i class="bi bi-plus-circle me-2"></i>New Project
            </button>
        </div>

        <div class="row g-4"></div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../script/project.js"></script>
</body>
</html>
