<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" type="text/css" href="../css/unified.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>

<body>

<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

            <div class="dropdown text-end">
                <a href="#" class="d-block text-decoration-none dropdown-toggle user-avatar" data-bs-toggle="dropdown">
                    <img src="../images/anonym_profile.png" width="40" height="40" class="rounded-circle">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                    <li>
                        <a class="dropdown-item" href="#" onclick="event.preventDefault(); ProjectManager.promptNewProject();">
                            <i class="bi bi-plus-circle me-2"></i>New project...
                        </a>
                    </li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to your Automato account</p>
        </div>

        <form action="/submit" method="POST" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
                    <i class="bi bi-person"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                    <i class="bi bi-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">Log In</button>

            <div class="login-divider">or</div>

        </form>

        <div class="login-footer">
            Don't have an account? <a href="#">Sign up</a>
        </div>

    </div>
</div>

</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Main.java"></script>
