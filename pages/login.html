<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn - Automato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" type="text/css" href="../css/unified.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>

<body>

<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/pages/homepage.html" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

            <div class="dropdown text-end">
                <a href="#" class="d-block text-decoration-none dropdown-toggle user-avatar" data-bs-toggle="dropdown">
                    <img src="../images/anonym_profile.png" width="40" height="40" class="rounded-circle">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to your Automato account</p>
        </div>

        <div id="loginAlert" class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;">
            <span id="loginErrorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form id="loginForm" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                    <i class="bi bi-person"></i>
                </div>
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <i class="bi bi-lock"></i>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-options">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Log In</button>

            <div class="login-divider">or</div>

        </form>

        <div class="login-footer">
            Don't have an account? <a href="/pages/signup.html">Sign up</a>
        </div>

    </div>
</div>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../script/api.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');

        // Validierung
        if (!username || !password) {
            showError('Please enter username and password');
            return;
        }

        // Button deaktivieren während des Requests
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

        try {
            const response = await API.login(username, password);

            if (response.error) {
                showError(response.error);
            } else {
                // Login erfolgreich - zur Homepage oder zu den Projekten
                window.location.href = '/pages/homepage.html';
            }
        } catch (error) {
            showError('An error occurred. Please try again.');
            console.error('Login error:', error);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Log In';
        }
    });

    function showError(message) {
        const alertDiv = document.getElementById('loginAlert');
        const errorMsg = document.getElementById('loginErrorMessage');
        errorMsg.textContent = message;
        alertDiv.style.display = 'block';
    }

    // Check if already logged in
    window.addEventListener('load', async () => {
        const user = await API.getCurrentUser();
        if (user && !user.error) {
            window.location.href = '/pages/homepage.html';
        }
    });
</script>

</html>
