<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Automato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="../css/unified.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>

<body>

<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/pages/homepage.html" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="../pages/transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

        </div>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2>Create account</h2>
            <p>Sign up for Automato</p>
        </div>

        <form id="signupForm" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required>
                    <i class="bi bi-person"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Choose a password" autocomplete="new-password" required>
                    <i class="bi bi-lock"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordConfirm" placeholder="Repeat your password" autocomplete="new-password" required>
                    <i class="bi bi-lock-fill"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" id="signupBtn">Sign Up</button>

        </form>

        <div class="login-footer">
            Already have an account? <a href="/pages/login.html">Log in</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../script/api.js"></script>
<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const btn = document.getElementById('signupBtn');

        if (!username || !password) {
            alert('Please fill in all fields.');
            return;
        }

        if (password !== passwordConfirm) {
            alert('Passwords do not match.');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        const res = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        });
        const result = await res.json();

        if (result.error) {
            alert(result.error);
            btn.disabled = false;
            btn.textContent = 'Sign Up';
        } else {
            // Direkt eingeloggt nach Registrierung
            window.location.href = '/pages/homepage.html';
        }
    });
</script>

</body>
</html>
