<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/qtip2/3.0.3/jquery.qtip.min.css">
    <link rel="stylesheet" type="text/css" href="http://cdnjs.cloudflare.com/ajax/libs/qtip2/2.2.0/jquery.qtip.css">
    <link rel="stylesheet" type="text/css" href="../css/transducer.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>

<body>
<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/pages/homepage.html" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="../pages/transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-dark" onclick="window.location.href='../pages/login.html'">Log In</button>
            </div>

            <div class="dropdown text-end">
                <a href="#" class="d-block text-decoration-none dropdown-toggle user-avatar" data-bs-toggle="dropdown">
                    <img src="../images/anonym_profile.png" width="40" height="40" class="rounded-circle">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); API.logout(); closeCurrentProject();"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="workspace-container">
    <div class="button-container">
        <div class="toolbar-group-left">
            <button onclick="addNode();">Add node</button>
            <button onclick="clearGraph();">Clear</button>
            <button onclick="exportPNG();">Export PNG</button>
            <button id="saveProjectBtn" onclick="saveCurrentProject();">
                <i class="bi bi-floppy me-1"></i>Save
            </button>
            <button id="closeProjectBtn" onclick="closeCurrentProject();" style="display:none;">
                <i class="bi bi-x-circle me-1"></i>Close Project
            </button>
            <span id="projectLabel" style="font-size:0.85rem; color: var(--primary-red); font-weight:600; margin-left:0.5rem;"></span>
        </div>
        <div class="toolbar-group-right">
            <input type="text" class="form-control toolbar-input" id="inputWord" placeholder="e.g.: input word">
            <button id="runAcceptorButton" onclick="inputWordSubmitHandler(event);">Run Transducer</button>
            <button type="button" id="runSimulationButton" onclick="runSimulation(event);">Run simulation</button>
            <button type="button" id="nextStepButton_t" onclick="nextStep(event);" disabled>Next ▷</button>
        </div>
    </div>

    <div class="graph-table-row">
        <div id="graph"></div>
        <div class="transducer-side-panel">
            <div class="table-container">
                <table class="table">
                    <thead id="transducerTableHead">
                    <tr>
                        <th>State</th>
                        <th>Input</th>
                        <th>Output</th>
                    </tr>
                    </thead>
                    <tbody id="transducerTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="inputWordResultContainer">
        <div class="result-card">
            <span class="result-label">Input</span>
            <span id="inputWordResultWord" class="badge badge-light"></span>
        </div>
        <div class="result-card">
            <span class="result-label">Output</span>
            <span id="inputWordResultAccepted" class="badge"></span>
        </div>
        <div class="result-card">
            <span class="result-label">Details</span>
            <span id="inputWordResultException" class="badge badge-warning"></span>
        </div>
    </div>
</div>

<!-- Modal: Neues Projekt erstellen -->
<div class="modal fade" id="newProjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Save as New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Project name</label>
                    <input type="text" class="form-control" id="newProjectName" placeholder="My Transducer">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-dark" onclick="confirmSaveAsNew()">Create & Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qtip2/3.0.3/jquery.qtip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-qtip@2.8.0/cytoscape-qtip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://code.jquery.com/jquery-2.0.3.min.js"></script>
<script src="../script/libs/jquery-2.0.3.min.js"></script>
<script src="../script/libs/jquery.qtip.js"></script>
<script src="../script/libs/cytoscape.min.js"></script>
<script src="../script/libs/cytoscape-qtip.js"></script>

<script src="../script/api.js"></script>
<script src="../script/scriptTransducer.js"></script>
<script src="../script/transducer.js"></script>
<script src="../script/transducerSBS.js"></script>
<script src="../script/simulationTransducer.js"></script>

<script>
    const saveBtn = document.getElementById('saveProjectBtn');
    const closeBtn = document.getElementById('closeProjectBtn');
    const projectLabel = document.getElementById('projectLabel');
    const username = API.getCurrentUsername();
    const _typeOk = !localStorage.getItem('currentProjectType') || localStorage.getItem('currentProjectType') === 'transducer';
    const pid = _typeOk ? localStorage.getItem('currentProjectID') : null;

    // Login-Button durch Benutzernamen ersetzen wenn angemeldet
    if (username) {
        document.getElementById('authArea').innerHTML =
            `<span class="fw-bold me-3" style="color: var(--primary-red);">
                <i class="bi bi-person-circle me-1"></i>${username}
            </span>`;
    }

    // Projekt-Status anzeigen
    if (!username) {
        // Nicht angemeldet: Save grau, kein Projektlabel, kein Close
        saveBtn.disabled = true;
        saveBtn.style.opacity = '0.5';
        saveBtn.style.cursor = 'not-allowed';
        saveBtn.title = "Please log in to save";
        projectLabel.style.display = 'none';
        closeBtn.style.display = 'none';
    } else if (!pid) {
        // Angemeldet, kein Projekt: Save aktiv (erstellt neues), kein Close
        saveBtn.disabled = false;
        saveBtn.title = "Save as new project";
        projectLabel.innerHTML = '<i class="bi bi-folder2-open me-1"></i>No project open';
        closeBtn.style.display = 'none';
    } else {
        // Angemeldet, Projekt offen: alles aktiv
        saveBtn.disabled = false;
        saveBtn.title = "";
        const projectName = localStorage.getItem('currentProjectName') || `Project ${pid}`;
        projectLabel.innerHTML = `<i class="bi bi-folder-fill me-1"></i>${projectName}`;
        closeBtn.style.display = 'inline-block';
    }

    function closeCurrentProject() {
        localStorage.removeItem('currentProjectID');
        localStorage.removeItem('currentProjectName');
        localStorage.removeItem('currentProjectType');
        window.location.href = window.location.pathname;
    }

    async function saveCurrentProject() {
        if (!username) return;

        const graphJson = localStorage.getItem(GRAPH_KEY);
        const currentPid = localStorage.getItem('currentProjectID');

        // Kein Projekt offen — neues erstellen
        if (!currentPid) {
            document.getElementById('newProjectName').value = '';
            new bootstrap.Modal(document.getElementById('newProjectModal')).show();
            return;
        }

        // Projekt offen — direkt speichern
        if (!graphJson) { alert('Nothing to save yet.'); return; }

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

        const result = await API.saveProject(currentPid, graphJson);

        if (result.error) {
            alert('Error saving: ' + result.error);
        } else {
            saveBtn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Saved!';
            setTimeout(() => {
                saveBtn.innerHTML = '<i class="bi bi-floppy me-1"></i>Save';
                saveBtn.disabled = false;
            }, 2000);
            return;
        }
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="bi bi-floppy me-1"></i>Save';
    }

    async function confirmSaveAsNew() {
        const name = document.getElementById('newProjectName').value.trim() || 'New Transducer Project';
        bootstrap.Modal.getInstance(document.getElementById('newProjectModal')).hide();

        const data = await API.createProject(name, 'transducer');
        if (data.error) { alert('Error: ' + data.error); return; }

        localStorage.setItem('currentProjectID', data.id);
        localStorage.setItem('currentProjectName', name);
        localStorage.setItem('currentProjectType', 'transducer');

        const graphJson = localStorage.getItem(GRAPH_KEY);
        if (graphJson) {
            const newKey = `transducer_${data.id}`;
            localStorage.setItem(newKey, graphJson);
            await API.saveProject(data.id, graphJson);
        }

        projectLabel.innerHTML = `<i class="bi bi-folder-fill me-1"></i>${name}`;
        closeBtn.style.display = 'inline-block';
        saveBtn.title = "";
        saveBtn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Saved!';
        setTimeout(() => {
            saveBtn.innerHTML = '<i class="bi bi-floppy me-1"></i>Save';
            saveBtn.disabled = false;
        }, 2000);
    }
</script>
</body>
</html>
