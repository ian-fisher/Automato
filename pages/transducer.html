<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automato</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- jQuery qTip2 CSS - MUST come before custom CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/qtip2/3.0.3/jquery.qtip.min.css">
    <link rel="stylesheet" type="text/css" href="http://cdnjs.cloudflare.com/ajax/libs/qtip2/2.2.0/jquery.qtip.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="../css/transducer.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>

<body>

<div class="secondary-header border-bottom py-3 bg-light-subtle">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between py-3">

            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-decoration-none">
                <div class="logo-circle">
                    <img src="../images/logo.png" width="40" height="40" class="rounded-circle">
                </div>
                <span class="logo-text ms-2">Automato</span>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../pages/acceptor.html" class="nav-link px-3">Acceptor</a></li>
                <li><a href="../pages/transducer.html" class="nav-link px-3">Transducer</a></li>
                <li><a href="../pages/aboutUs.html" class="nav-link px-3">About us</a></li>
            </ul>

            <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="search" class="form-control border-start-0 ps-0" placeholder="Search...">
                </div>
            </form>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-dark">Log In</button>
            </div>

            <div class="dropdown text-end">
                <a href="#" class="d-block text-decoration-none dropdown-toggle user-avatar" data-bs-toggle="dropdown">
                    <img src="../images/anonym_profile.png" width="40" height="40" class="rounded-circle">
                </a>

                <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                    <li>
                        <a class="dropdown-item" href="#" onclick="event.preventDefault(); ProjectManager.promptNewProject();">
                            <i class="bi bi-plus-circle me-2"></i>New project...
                        </a>
                    </li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- Graph controls -->
<div class="workspace-container">
    <p>Here, you can build and test your own transducer.</p>

    <!-- Input word -->
    <form class="form-inline" id="inputWordForm">
        <div class="form-group">
            <label id="inputWordLabel" for="inputWord">Input word: </label>
            <input type="text" class="form-control" id="inputWord" aria-describedby="inputWordDescription" placeholder="e.g. abacaba">
        </div>

        <div class="form-group">
            <button
                    type="submit" class="btn btn-secondary"
                    onclick="inputWordSubmitHandler(event);"
            >Run Transducer</button>
        </div>
    </form>

    <div class="card" id="inputWordResultContainer">
        <ul class="list-group list-group-flush">
            <li class="list-group-item">Input: <span id="inputWordResultWord" class="badge badge-light"></span></li>
            <li class="list-group-item">Output: <span id="inputWordResultAccepted" class="badge"></span></li>
            <li class="list-group-item">Details: <span id="inputWordResultException" class="badge badge-warning"></span></li>
        </ul>
    </div>

    <div class="button-container">
        <button onclick="addNode();">Add node</button>
        <button onclick="clearGraph();">Clear</button>
        <button onclick="exportPNG();">Export PNG</button>
    </div>

    <div class="graph-table-row">
        <div id="graph">
            <!-- Graph will be rendered here -->
        </div>

        <table class="table">
            <thead id="transducerTableHead">
            <tr>
                <th>State</th>
                <th>Input</th>
                <th>Output</th>
            </tr>
            </thead>
            <tbody id="transducerTableBody">
            </tbody>
        </table>
    </div>
</div>
</body>

<!-- CRITICAL: Scripts must be loaded in this exact order -->
<!-- jQuery FIRST (everything else depends on it) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>

<!-- jQuery plugins (depend on jQuery) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qtip2/3.0.3/jquery.qtip.min.js"></script>

<!-- Cytoscape core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>

<!-- Cytoscape extensions (depend on both jQuery and Cytoscape) -->
<script src="https://cdn.jsdelivr.net/npm/cytoscape-qtip@2.8.0/cytoscape-qtip.min.js"></script>

<!-- Bootstrap (can go anywhere but good to be before custom scripts) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="http://code.jquery.com/jquery-2.0.3.min.js"></script>
<script src="../script/libs/jquery-2.0.3.min.js"></script>
<script src="../script/libs/jquery.qtip.js"></script>
<script src="../script/libs/cytoscape.min.js"></script>
<script src="../script/libs/cytoscape-qtip.js"></script>
<script src="../script/scriptTransducer.js"></script>
<script src="../script/transducer.js"></script>

</html>
