<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automato</title>
  <link rel="stylesheet" type="text/css" href="http://cdnjs.cloudflare.com/ajax/libs/qtip2/2.2.0/jquery.qtip.css">
  <link rel="stylesheet" type="text/css" href="css/libs/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
  <div id="container">
    <div class="row">
      <h1>
        <img class="img-fluid col-1 align-middle" src="images/logo.png">
        Automato
      </h1>
    </div>         
  </div>
  <p>Here, you can build and test your own acceptor.</p>

  <hr>

  <!-- Input word -->
  <form id="inputWordForm">
    <div class="form-group">
      <label id="inputWordLabel" for="inputWord">Input word</label>
      <input type="text" class="form-control" id="inputWord" aria-describedby="inputWordDescription" placeholder="e.g. abacaba">
      <small id="inputWordDescription" class="form-text text-muted">Enter the input word for the acceptor.</small>
    </div>
    <button
    type="submit" class="btn btn-secondary"
    onclick="inputWordSubmitHandler(event);"
    >Run acceptor</button>
  </form> 
  <hr>

  <!-- Graph controls -->
  <button onclick="addNode();">Add node</button>
  <button onclick="clearGraph();">Clear</button>
  <button onclick="exportPNG();">Export PNG</button>


  <!-- Graph --->
  <div id="graph">
    <!-- Graph will be rendered here -->
  </div>

</body>
<script src="http://code.jquery.com/jquery-2.0.3.min.js"></script>
<script src="script/libs/jquery-2.0.3.min.js"></script>
<script src="script/libs/jquery.qtip.js"></script>
<script src="script/libs/cytoscape.min.js"></script>
<script src="script/libs/cytoscape-qtip.js"></script>
<script src="script/script.js"></script>
<script src="script/Acceptor.js"></script>
<script src="script/wordinput.js"></script>
</html>
